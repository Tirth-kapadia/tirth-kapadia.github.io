<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#f8f6f3">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tirth Kapadia — Reading</title>
<meta name="robots" content="noindex">
<meta name="description" content="Read this research document by Tirth Kapadia in-browser, with page navigation, zoom, and a direct download option.">

<link rel="preload" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" as="style">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
/* ===== Mobile baseline ===== */
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
a, button, [role="button"] { touch-action: manipulation; }

:root {
  --dark: #1B3A5C;
  --blue: #2E75A3;
  --light-blue: #dceef8;
  --text: #1a1a1a;
  --muted: #5a6a7a;
  --border: #d4dfe8;
  --bg: #f8f6f3;
  --white: #ffffff;
  --bar-h: 56px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--bg);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ===== Toolbar: one row, never wraps, never covers the document ===== */
.viewer-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  height: calc(var(--bar-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  white-space: nowrap;
}

.back-link {
  font-size: 0.82rem; font-weight: 500; color: var(--muted);
  text-decoration: none; letter-spacing: 0.03em;
  display: inline-flex; align-items: center;
  min-height: 44px; flex-shrink: 0;
}

.doc-title {
  font-family: 'EB Garamond', serif; font-size: 1rem; color: var(--dark);
  overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 auto; min-width: 0;
}

.spacer { flex: 1 1 auto; }

.page-indicator {
  font-size: 0.8rem; color: var(--muted);
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}

.zoom-group {
  display: flex; align-items: center; flex-shrink: 0;
  background: var(--white); border: 1px solid var(--border); border-radius: 4px;
}

.zoom-btn {
  width: 40px; height: 38px; border: none; background: transparent;
  color: var(--dark); font-size: 1.1rem; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.zoom-btn:disabled { opacity: 0.3; cursor: default; }

.zoom-pct {
  font-size: 0.75rem; color: var(--muted); min-width: 42px;
  text-align: center; font-variant-numeric: tabular-nums;
  border: none; background: transparent; cursor: pointer; height: 38px;
  font-family: inherit;
}

.dl-btn {
  font-size: 0.74rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--white); background: var(--dark); text-decoration: none;
  padding: 0 0.9rem; height: 38px; border-radius: 4px;
  display: inline-flex; align-items: center; flex-shrink: 0;
}

@media (hover: hover) and (pointer: fine) {
  .back-link:hover { color: var(--blue); }
  .zoom-btn:not(:disabled):hover, .zoom-pct:hover { background: var(--light-blue); }
  .dl-btn:hover { background: var(--blue); }
}

/* ===== Document: pages stacked, normal vertical scrolling.
   When zoomed wider than the screen, only the document scrolls sideways;
   the toolbar always stays in place. ===== */
html, body { overflow-x: hidden; }
.doc {
  padding-top: calc(var(--bar-h) + env(safe-area-inset-top) + 20px);
  padding-bottom: calc(32px + env(safe-area-inset-bottom));
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.pages {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  width: max-content; min-width: 100%;
  padding: 0 16px;
}

.page {
  position: relative;
  background: var(--white);
  border: 1px solid var(--border);
  box-shadow: 0 2px 14px rgba(27,58,92,0.10);
  flex-shrink: 0;
}

.page canvas { display: block; width: 100%; height: 100%; }

.status-msg {
  font-family: 'EB Garamond', serif; font-size: 1.05rem; color: var(--muted);
  text-align: center; padding: 3rem 1rem;
}
.status-msg a { color: var(--blue); }

/* ===== Phones: drop the title so the bar fits on one row ===== */
@media (max-width: 640px) {
  .viewer-bar { gap: 0.5rem; }
  .doc-title { display: none; }
  .pages { padding: 0 8px; gap: 10px; }
  .dl-btn { padding: 0 0.7rem; }
}
@media (max-width: 360px) {
  .zoom-pct { display: none; }
  .zoom-btn { width: 36px; }
}
</style>
</head>
<body>

<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">PDF Document Viewer — Tirth Kapadia</h1>

<header class="viewer-bar">
  <a href="index.html#publications" class="back-link">&larr; Back</a>
  <span class="doc-title" id="docTitle"></span>
  <span class="spacer"></span>
  <span class="page-indicator" id="pageIndicator" aria-live="polite">&ndash; / &ndash;</span>
  <div class="zoom-group">
    <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">&minus;</button>
    <button class="zoom-pct" id="zoomPct" title="Fit to width">100%</button>
    <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
  </div>
  <a id="downloadLink" class="dl-btn" download>Download</a>
</header>

<main class="doc" id="doc">
  <div class="pages" id="pages">
    <div id="statusMsg" class="status-msg">Loading document&hellip;</div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script>
window.addEventListener('load', async () => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const params = new URLSearchParams(window.location.search);
  const rawFile = params.get('file') || '';
  // Only allow PDFs that live in this site's folder.
  const file = /^[\w.\-]+\.pdf$/i.test(rawFile) ? rawFile : '';
  const title = params.get('title') || (file ? file.replace(/\.pdf$/i, '').replace(/_/g, ' ') : 'Document');

  const docEl = document.getElementById('pages');
  const scroller = document.getElementById('doc');
  const statusMsg = document.getElementById('statusMsg');
  const pageIndicator = document.getElementById('pageIndicator');
  const zoomPct = document.getElementById('zoomPct');
  const zoomInBtn = document.getElementById('zoomIn');
  const zoomOutBtn = document.getElementById('zoomOut');
  const downloadLink = document.getElementById('downloadLink');

  document.getElementById('docTitle').textContent = title;
  document.title = title + ' — Tirth Kapadia';

  if (!file) { statusMsg.textContent = 'No document specified.'; return; }
  downloadLink.href = file;
  downloadLink.setAttribute('download', file);

  const ZOOMS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
  let zoomIdx = 2;
  const pages = [];
  let pdf;

  try {
    pdf = await pdfjsLib.getDocument(file).promise;
  } catch (err) {
    statusMsg.innerHTML = 'Could not load this document. <a href="' + file + '" download>Download the PDF</a> instead.';
    console.error(err);
    return;
  }
  statusMsg.remove();

  // Build one placeholder per page so the scroll height is right before rendering.
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 1 });
    const wrap = document.createElement('div');
    wrap.className = 'page';
    wrap.dataset.index = i - 1;
    const canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    docEl.appendChild(wrap);
    pages.push({ page, w: vp.width, h: vp.height, wrap, canvas, renderedAt: 0, task: null, visible: false });
  }

  function fitWidth() {
    const pad = window.innerWidth <= 640 ? 16 : 32;
    return Math.min(window.innerWidth - pad, 860);
  }

  function layout() {
    const base = fitWidth();
    const z = ZOOMS[zoomIdx];
    for (const p of pages) {
      const cssW = Math.round(base * z);
      p.cssW = cssW;
      p.wrap.style.width = cssW + 'px';
      p.wrap.style.height = Math.round(cssW * p.h / p.w) + 'px';
    }
    zoomPct.textContent = Math.round(z * 100) + '%';
    zoomOutBtn.disabled = zoomIdx === 0;
    zoomInBtn.disabled = zoomIdx === ZOOMS.length - 1;
    pages.forEach(p => { if (p.visible) render(p); });
  }

  function render(p) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const target = p.cssW * dpr;
    if (p.renderedAt === target) return;
    if (p.task) p.task.cancel();
    const viewport = p.page.getViewport({ scale: target / p.w });
    const off = document.createElement('canvas');
    off.width = Math.floor(viewport.width);
    off.height = Math.floor(viewport.height);
    p.task = p.page.render({ canvasContext: off.getContext('2d'), viewport });
    p.task.promise.then(() => {
      // Swap in the finished render so pages never flash blank.
      p.canvas.width = off.width;
      p.canvas.height = off.height;
      p.canvas.getContext('2d').drawImage(off, 0, 0);
      p.renderedAt = target;
      p.task = null;
    }).catch(() => { p.task = null; });
  }

  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const p = pages[+e.target.dataset.index];
      p.visible = e.isIntersecting;
      if (p.visible) render(p);
    }
  }, { rootMargin: '1200px 0px' });
  pages.forEach(p => io.observe(p.wrap));

  function updateIndicator() {
    const probe = window.innerHeight * 0.35;
    let current = 1;
    for (const p of pages) {
      if (p.wrap.getBoundingClientRect().top <= probe) current = +p.wrap.dataset.index + 1;
      else break;
    }
    pageIndicator.textContent = current + ' / ' + pages.length;
  }

  function setZoom(idx) {
    idx = Math.max(0, Math.min(ZOOMS.length - 1, idx));
    if (idx === zoomIdx) return;
    // Keep the reader at the same spot in the document.
    const docH = document.documentElement.scrollHeight;
    const yRatio = (window.scrollY + window.innerHeight / 2) / docH;
    const xRatio = (scroller.scrollLeft + scroller.clientWidth / 2) / scroller.scrollWidth;
    zoomIdx = idx;
    layout();
    window.scrollTo(0, yRatio * document.documentElement.scrollHeight - window.innerHeight / 2);
    scroller.scrollLeft = xRatio * scroller.scrollWidth - scroller.clientWidth / 2;
    updateIndicator();
  }

  zoomInBtn.addEventListener('click', () => setZoom(zoomIdx + 1));
  zoomOutBtn.addEventListener('click', () => setZoom(zoomIdx - 1));
  zoomPct.addEventListener('click', () => setZoom(2));

  window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '+' || e.key === '=') setZoom(zoomIdx + 1);
    if (e.key === '-' || e.key === '_') setZoom(zoomIdx - 1);
  });

  window.addEventListener('scroll', updateIndicator, { passive: true });

  // Re-fit only when the width really changes (not when a phone's address bar hides).
  let lastW = window.innerWidth, t;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (window.innerWidth !== lastW) { lastW = window.innerWidth; layout(); updateIndicator(); }
    }, 150);
  });

  layout();
  updateIndicator();
});
</script>

</body>
</html>
