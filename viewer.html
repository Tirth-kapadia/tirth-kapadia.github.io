<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tirth Kapadia — Reading</title>
<meta name="robots" content="noindex">

<link rel="preload" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" as="style">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">

<style>
  :root {
    --dark: #1B3A5C;
    --blue: #2E75A3;
    --light-blue: #dceef8;
    --text: #1a1a1a;
    --muted: #5a6a7a;
    --border: #d4dfe8;
    --bg: #f8f6f3;
    --white: #ffffff;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    height: 100%;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .viewer-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    background: rgba(248, 246, 243, 0.97);
    border-bottom: 1px solid var(--border);
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .bar-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }

  .back-link {
    font-size: 0.78rem; font-weight: 500; color: var(--muted);
    text-decoration: none; letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 0.4rem;
    white-space: nowrap; transition: color 0.2s;
    min-height: 48px; min-width: 48px;
  }
  .back-link:hover { color: var(--blue); }

  .doc-title {
    font-family: 'EB Garamond', serif; font-size: 1rem; color: var(--dark);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .bar-right { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

  .zoom-group {
    display: flex; align-items: center; gap: 0.35rem;
    background: var(--white); border: 1px solid var(--border);
    border-radius: 3px; padding: 0.2rem;
  }

  .zoom-btn {
    width: 30px; height: 30px; border: none; background: transparent;
    color: var(--dark); font-size: 1.05rem; font-weight: 600; cursor: pointer;
    border-radius: 2px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s; min-height: 48px; min-width: 44px;
  }
  .zoom-btn:hover { background: var(--light-blue); }

  .zoom-pct {
    font-size: 0.75rem; color: var(--muted); min-width: 44px;
    text-align: center; font-variant-numeric: tabular-nums; cursor: pointer;
  }

  .page-group { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; color: var(--muted); }

  .page-btn {
    width: 28px; height: 28px; border: 1px solid var(--border); background: var(--white);
    color: var(--dark); cursor: pointer; border-radius: 3px; font-size: 0.85rem;
    display: flex; align-items: center; justify-content: center; transition: border-color 0.15s;
    min-height: 48px; min-width: 44px;
  }
  .page-btn:hover { border-color: var(--blue); }
  .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .dl-btn {
    font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--white); background: var(--dark); text-decoration: none;
    padding: 0.5rem 1rem; border-radius: 3px; white-space: nowrap; transition: background 0.2s;
    min-height: 48px; display: inline-flex; align-items: center;
  }
  .dl-btn:hover { background: var(--blue); }

  .viewer-stage {
    position: fixed;
    top: 58px; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    overflow: hidden;
    touch-action: none;
    contain: strict;
  }

  .zoom-layer {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  .pdf-canvas-wrap {
    background: var(--white);
    box-shadow: 0 2px 18px rgba(27,58,92,0.12);
    border: 1px solid var(--border);
    display: inline-block;
    border-radius: 3px;
  }

  #pdfCanvas { display: block; }

  .status-msg {
    font-family: 'EB Garamond', serif; font-size: 1rem; color: var(--muted);
    text-align: center; padding-top: 4rem;
  }

  .hint {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    font-size: 0.72rem; color: var(--muted); background: rgba(255,255,255,0.85);
    border: 1px solid var(--border); padding: 0.4rem 0.9rem; border-radius: 20px;
    z-index: 5; pointer-events: none; transition: opacity 0.4s ease;
  }

  @media (max-width: 640px) {
    .viewer-bar { padding: 0 0.9rem; }
    .doc-title { display: none; }
  }
</style>
</head>
<body>

<div class="viewer-bar">
  <div class="bar-left">
    <a href="index.html#publications" class="back-link">&larr; Back</a>
    <span class="doc-title" id="docTitle">Loading&hellip;</span>
  </div>
  <div class="bar-right">
    <div class="page-group">
      <button class="page-btn" id="prevPage" aria-label="Previous page">&lsaquo;</button>
      <span id="pageIndicator">&mdash; / &mdash;</span>
      <button class="page-btn" id="nextPage" aria-label="Next page">&rsaquo;</button>
    </div>
    <div class="zoom-group">
      <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">&minus;</button>
      <span class="zoom-pct" id="zoomPct" title="Reset zoom">100%</span>
      <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
    </div>
    <a id="downloadLink" class="dl-btn" download>Download</a>
  </div>
</div>

<div class="viewer-stage" id="stage">
  <div id="statusMsg" class="status-msg">Loading document&hellip;</div>
  <div class="zoom-layer" id="zoomLayer" style="display:none;">
    <div class="pdf-canvas-wrap">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>
</div>

<div class="hint" id="hint">Pinch, scroll, or drag to zoom and pan — like a photo</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script>
window.addEventListener('load', () => {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const params = new URLSearchParams(window.location.search);
  const file   = params.get('file');
  const title  = params.get('title') || (file ? decodeURIComponent(file.replace(/\.pdf$/i,'').replace(/_/g,' ')) : 'Document');

  document.getElementById('docTitle').textContent = title;
  document.title = title + ' — Tirth Kapadia';

  const downloadLink  = document.getElementById('downloadLink');
  const statusMsg     = document.getElementById('statusMsg');
  const stage         = document.getElementById('stage');
  const zoomLayer     = document.getElementById('zoomLayer');
  const canvas        = document.getElementById('pdfCanvas');
  const ctx           = canvas.getContext('2d');
  const pageIndicator = document.getElementById('pageIndicator');
  const zoomPct       = document.getElementById('zoomPct');
  const hint          = document.getElementById('hint');

  let pdfDoc      = null;
  let currentPage = 1;
  let baseCssW = 0, baseCssH = 0;
  const HEADROOM = 3;

  let scale = 1, tx = 0, ty = 0;
  const MIN_SCALE = 0.4, MAX_SCALE = HEADROOM * 1.6;

  if (!file) {
    statusMsg.textContent = 'No document specified.';
  } else {
    downloadLink.href = file;
    downloadLink.setAttribute('download', file);

    pdfjsLib.getDocument(file).promise.then(doc => {
      pdfDoc = doc;
      statusMsg.style.display = 'none';
      zoomLayer.style.display = 'inline-block';
      renderPage(currentPage);
      setTimeout(() => { hint.style.opacity = '0'; }, 2600);
    }).catch(err => {
      statusMsg.textContent = 'Could not load this document. Try the Download button above.';
      console.error(err);
    });
  }

  function renderPage(num) {
    if (!pdfDoc) return;
    pdfDoc.getPage(num).then(page => {
      const unscaled = page.getViewport({ scale: 1 });
      const stageW = stage.clientWidth;
      const fitScale = Math.min((stageW * 0.92) / unscaled.width, 1.6);

      baseCssW = unscaled.width * fitScale;
      baseCssH = unscaled.height * fitScale;

      const dpr = window.devicePixelRatio || 1;
      const renderScale = fitScale * dpr * HEADROOM;

      const renderViewport = page.getViewport({ scale: renderScale });
      canvas.width  = renderViewport.width;
      canvas.height = renderViewport.height;
      canvas.style.width  = baseCssW + 'px';
      canvas.style.height = baseCssH + 'px';

      page.render({ canvasContext: ctx, viewport: renderViewport }).promise.then(() => {
        pageIndicator.textContent = num + ' / ' + pdfDoc.numPages;
        document.getElementById('prevPage').disabled = num <= 1;
        document.getElementById('nextPage').disabled = num >= pdfDoc.numPages;
        resetView(true);
      });
    });
  }

  function applyTransform() {
    zoomLayer.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    zoomPct.textContent = Math.round(scale * 100) + '%';
  }

  function centerContent() {
    const stageW = stage.clientWidth, stageH = stage.clientHeight;
    tx = (stageW - baseCssW * scale) / 2;
    ty = Math.max(16, (stageH - baseCssH * scale) / 2);
  }

  function resetView(keepScale) {
    if (!keepScale) scale = 1;
    centerContent();
    applyTransform();
  }

  function zoomAt(px, py, newScale) {
    newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
    const cx = (px - tx) / scale;
    const cy = (py - ty) / scale;
    scale = newScale;
    tx = px - cx * scale;
    ty = py - cy * scale;
    applyTransform();
  }

  document.getElementById('prevPage').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderPage(currentPage); }
  });
  document.getElementById('nextPage').addEventListener('click', () => {
    if (pdfDoc && currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }
  });

  document.getElementById('zoomIn').addEventListener('click', () => {
    const r = stage.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, scale + 0.4);
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    const r = stage.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, scale - 0.4);
  });
  zoomPct.addEventListener('click', () => resetView(false));

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = stage.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const delta = -e.deltaY * 0.01;
      zoomAt(px, py, scale * (1 + delta));
    } else {
      tx -= e.deltaX;
      ty -= e.deltaY;
      applyTransform();
    }
  }, { passive: false });

  let touchMode = null, lastX = 0, lastY = 0, startDist = 0, startScale = 1, lastTapTime = 0;

  function touchDist(t0, t1) { return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY); }
  function touchMid(t0, t1, rect) {
    return { x: (t0.clientX + t1.clientX) / 2 - rect.left, y: (t0.clientY + t1.clientY) / 2 - rect.top };
  }

  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchMode = 'pan';
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      const now = Date.now();
      if (now - lastTapTime < 300) {
        const r = stage.getBoundingClientRect();
        const px = e.touches[0].clientX - r.left, py = e.touches[0].clientY - r.top;
        zoomAt(px, py, scale > 1.3 ? 1 : 2.2);
        touchMode = null;
      }
      lastTapTime = now;
    } else if (e.touches.length === 2) {
      touchMode = 'pinch';
      startDist  = touchDist(e.touches[0], e.touches[1]);
      startScale = scale;
    }
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (touchMode === 'pan' && e.touches.length === 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
      tx += dx; ty += dy;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      applyTransform();
    } else if (touchMode === 'pinch' && e.touches.length === 2) {
      e.preventDefault();
      const r = stage.getBoundingClientRect();
      const dist = touchDist(e.touches[0], e.touches[1]);
      const mid  = touchMid(e.touches[0], e.touches[1], r);
      zoomAt(mid.x, mid.y, startScale * (dist / startDist));
    }
  }, { passive: false });

  stage.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) touchMode = null;
    else if (e.touches.length === 1) { touchMode = 'pan'; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  }, { passive: true });

  let dragging = false, dragX = 0, dragY = 0;
  stage.addEventListener('mousedown', (e) => { dragging = true; dragX = e.clientX; dragY = e.clientY; stage.style.cursor = 'grabbing'; });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    tx += e.clientX - dragX; ty += e.clientY - dragY;
    dragX = e.clientX; dragY = e.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; stage.style.cursor = ''; });

  window.addEventListener('keydown', (e) => {
    if (e.key === '+' || e.key === '=') document.getElementById('zoomIn').click();
    if (e.key === '-' || e.key === '_') document.getElementById('zoomOut').click();
    if (e.key === 'ArrowRight') document.getElementById('nextPage').click();
    if (e.key === 'ArrowLeft')  document.getElementById('prevPage').click();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (pdfDoc) renderPage(currentPage); }, 150);
  });
});
</script>

</body>
</html>
